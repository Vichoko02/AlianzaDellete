name: CI
on:
  push:
  pull_request:

jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar slapd y utilidades
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y slapd ldap-utils gettext-base
          sudo systemctl disable --now slapd
      - name: Prueba de punta a punta
        run: sudo pruebas/prueba.sh
