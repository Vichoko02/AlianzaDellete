# Conecta el servidor al directorio LDAP (rama programa/ldap) por la red compartida "alianza-red".
services:
  servidor:
    environment:
      Ldap__Habilitado: "true"
      Ldap__Servidor: ldap
      Ldap__Puerto: "389"
      Ldap__BaseDn: ${LDAP_BASE_DN:-dc=alianza,dc=local}
      Ldap__CuentaServicioDn: cn=alianza-backend,ou=services,${LDAP_BASE_DN:-dc=alianza,dc=local}
      Ldap__CuentaServicioContrasena: ${LDAP_CONTRASENA_SERVIDOR:?Define LDAP_CONTRASENA_SERVIDOR en .env}
      Ldap__SuperadminDn: uid=yishadmin,ou=people,${LDAP_BASE_DN:-dc=alianza,dc=local}
    networks: [default, alianza]

networks:
  alianza:
    name: alianza-red
    external: true
