# Servidor de La Alianza: PostgreSQL + servidor (que también entrega el panel en /panel).
#   cp .env.example .env   # y completa las variables
#   docker compose up -d --build
# Con LDAP (rama programa/ldap): docker compose -f docker-compose.yml -f docker-compose.ldap.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: alianza
      POSTGRES_USER: alianza
      POSTGRES_PASSWORD: ${CONTRASENA_POSTGRES:?Define CONTRASENA_POSTGRES en .env}
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alianza -d alianza"]
      interval: 5s
      timeout: 5s
      retries: 20

  servidor:
    build: .
    image: alianza-servidor:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BaseDeDatos: "Host=postgres;Database=alianza;Username=alianza;Password=${CONTRASENA_POSTGRES}"
      Sesiones__Clave: ${CLAVE_SESIONES:?Define CLAVE_SESIONES en .env (openssl rand -hex 32)}
      Superadmin__NombreUsuario: ${SUPERADMIN_USUARIO:-YishAdmin}
      Superadmin__Contrasena: ${SUPERADMIN_CONTRASENA:-}
      Publico__UrlApi: ${URL_SERVIDOR:-}
      Publico__UrlSitio: ${URL_SITIO:-}
      OrigenesPermitidos__0: ${URL_SITIO:-http://localhost:5173}
      CargaInicial__ImportarContenido: ${IMPORTAR_CONTENIDO:-false}
      CargaInicial__CarpetaImagenes: /imagenes-sitio
      Ldap__Habilitado: "false"
    volumes:
      # Carpeta src/assets del sitio, solo para la importación inicial de imágenes.
      - ${CARPETA_IMAGENES_SITIO:-./carga-inicial}:/imagenes-sitio:ro
    # Solo en localhost: ponlo detrás de un proxy inverso con HTTPS (Caddy, nginx...).
    ports:
      - "127.0.0.1:${PUERTO:-8080}:8080"

volumes:
  datos-postgres:
