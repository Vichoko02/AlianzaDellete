# Directorio LDAP de La Alianza.
# Requiere una vez: docker network create alianza-red   (red compartida con el servidor)
services:
  ldap:
    build: .
    image: alianza-ldap:latest
    restart: unless-stopped
    env_file: .env
    environment:
      LDAP_URLS: "ldap:///"
    volumes:
      - ldap-config:/etc/ldap/slapd.d
      - ldap-datos:/var/lib/ldap
      - ./respaldos:/respaldos
    # Solo accesible desde esta máquina; el servidor lo alcanza por la red interna como "ldap:389".
    ports:
      - "127.0.0.1:${LDAP_PUERTO_LOCAL:-389}:389"
    networks: [alianza]

  # Interfaz web opcional para inspeccionar el directorio: docker compose --profile ui up -d
  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    profiles: [ui]
    restart: unless-stopped
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: ldap
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "127.0.0.1:${PHPLDAPADMIN_PUERTO:-8090}:80"
    depends_on: [ldap]
    networks: [alianza]

volumes:
  ldap-config:
  ldap-datos:

networks:
  alianza:
    name: alianza-red
    external: true
