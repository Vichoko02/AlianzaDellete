server {
    listen      80;
    listen      [::]:80;
    server_name somosalianza.com www.somosalianza.com;

    root  /var/www/somosalianza;
    index index.html;

    access_log /var/log/nginx/somosalianza.access.log;
    error_log  /var/log/nginx/somosalianza.error.log;

    # Los assets de Vite llevan hash en el nombre: cachear agresivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html nunca se cachea, o el deploy nuevo no lo ve nadie.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA de React Router: cualquier ruta desconocida la resuelve el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    # Solo texto: webp/gif/mp4 ya vienen comprimidos, recomprimir gasta CPU sin ganancia.
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml application/xml;

    client_max_body_size 1m;
}
