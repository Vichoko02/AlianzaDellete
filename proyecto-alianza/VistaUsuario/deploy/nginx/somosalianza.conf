# Bloque HTTP: solo renovacion ACME y redirect. Ojo, este redirect asume que el
# 443 esta abierto en la Security List de OCI; si se cierra, el sitio cae entero.
server {
    listen      80;
    listen      [::]:80;
    server_name somosalianza.com www.somosalianza.com;

    access_log /var/log/nginx/somosalianza.access.log;
    error_log  /var/log/nginx/somosalianza.error.log;

    # La renovacion de certbot se resuelve por HTTP, antes del redirect.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/somosalianza;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name somosalianza.com www.somosalianza.com;

    root  /var/www/somosalianza;
    index index.html;

    access_log /var/log/nginx/somosalianza.ssl.access.log;
    error_log  /var/log/nginx/somosalianza.ssl.error.log;

    ssl_certificate     /etc/letsencrypt/live/somosalianza.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/somosalianza.com/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    # Sin OCSP stapling: Let's Encrypt ya no publica responder URL en el cert.

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml application/xml;

    client_max_body_size 1m;
}
