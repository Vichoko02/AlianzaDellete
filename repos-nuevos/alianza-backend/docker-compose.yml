# Backend de La Alianza: PostgreSQL + API (que también sirve el panel en /admin).
#   cp .env.example .env   # y completa las variables
#   docker compose up -d --build
# Con LDAP (repositorio alianza-ldap): docker compose -f docker-compose.yml -f docker-compose.ldap.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: alianza
      POSTGRES_USER: alianza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - pg-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alianza -d alianza"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    image: alianza-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Alianza: "Host=postgres;Database=alianza;Username=alianza;Password=${POSTGRES_PASSWORD}"
      Jwt__Clave: ${JWT_CLAVE:?Define JWT_CLAVE en .env (openssl rand -hex 32)}
      Admin__Username: ${ADMIN_USERNAME:-YishAdmin}
      Admin__Password: ${ADMIN_PASSWORD:-}
      Publico__UrlBase: ${URL_PUBLICA_API:-}
      Publico__UrlSitio: ${CORS_ORIGEN_SITIO:-}
      Cors__Origenes__0: ${CORS_ORIGEN_SITIO:-http://localhost:5173}
      Seed__ImportarContenido: ${IMPORTAR_CONTENIDO:-false}
      Seed__CarpetaAssets: /seed-assets
      Ldap__Habilitado: "false"
      Swagger: ${SWAGGER:-false}
    volumes:
      # Carpeta src/assets del frontend (VistaUsuario) para la importación inicial de imágenes.
      - ${RUTA_ASSETS_FRONTEND:-./seed}:/seed-assets:ro
    # Publicado solo en localhost: ponlo detrás de un proxy inverso con HTTPS (Caddy, nginx...).
    ports:
      - "127.0.0.1:${API_PUERTO:-8080}:8080"

volumes:
  pg-datos:
