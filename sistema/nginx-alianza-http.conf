# Protección de nginx para La Alianza (nivel http). instalar.sh lo copia a /etc/nginx/conf.d/alianza.conf.
# Todo funciona sin conexión: la base de países viene del paquete geoip-database de Ubuntu/Debian y se actualiza con apt.
# 1) países permitidos  2) límites por IP  3) tiempos de espera  4) registro de lo bloqueado (lo lee el panel).

# ─── 1. Países permitidos ─────────────────────────────────────────────────────
# América (todo el continente y el Caribe), la Unión Europea y Australia. Lo demás (Asia, África, Europa del Este fuera
# de la UE, Oceanía salvo Australia) se bloquea. Para permitir otro país, agrega una línea con su código ISO y un 1.
# Las IP sin país conocido (redes privadas, anycast de algunos proveedores) se permiten, para no cortar servicios legítimos.
geoip_country /usr/share/GeoIP/GeoIPv6.dat;   # IPv4 e IPv6 en un solo archivo

map $geoip_country_code $alianza_pais_permitido {
    default 0;
    ""      1;
    # América del Norte y Central
    US 1; CA 1; MX 1; GT 1; BZ 1; SV 1; HN 1; NI 1; CR 1; PA 1; GL 1; PM 1; BM 1;
    # Caribe
    CU 1; DO 1; HT 1; JM 1; PR 1; BS 1; BB 1; TT 1; AG 1; DM 1; GD 1; KN 1; LC 1; VC 1; AW 1; CW 1; SX 1; BQ 1;
    KY 1; TC 1; VG 1; VI 1; AI 1; MS 1; GP 1; MQ 1; BL 1; MF 1;
    # América del Sur
    AR 1; BO 1; BR 1; CL 1; CO 1; EC 1; GY 1; PY 1; PE 1; SR 1; UY 1; VE 1; GF 1; FK 1;
    # Unión Europea (27 países) y redes asignadas a la UE en conjunto
    AT 1; BE 1; BG 1; HR 1; CY 1; CZ 1; DK 1; EE 1; FI 1; FR 1; DE 1; GR 1; HU 1; IE 1; IT 1; LV 1; LT 1; LU 1;
    MT 1; NL 1; PL 1; PT 1; RO 1; SK 1; SI 1; ES 1; SE 1; EU 1;
    # Australia
    AU 1;
}

# ─── 2. Límites por IP (contra inundaciones de peticiones) ────────────────────
limit_req_zone  $binary_remote_addr zone=alianza_sitio:10m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=alianza_api:10m   rate=10r/s;
limit_req_zone  $binary_remote_addr zone=alianza_sesion:5m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=alianza_conexiones:10m;
limit_req_status  429;
limit_conn_status 429;

# ─── 3. Tiempos de espera (contra conexiones lentas que acaparan el servidor) ─
client_header_timeout 10s;
client_body_timeout   15s;
send_timeout          15s;
keepalive_timeout     15s;
reset_timedout_connection on;
large_client_header_buffers 4 8k;
server_tokens off;

# ─── 4. Registro de lo bloqueado ──────────────────────────────────────────────
# Formato: fecha ip país permitido estado "petición". El panel (Seguridad) cuenta las últimas 24 horas.
log_format alianza_bloqueos '$time_iso8601 $remote_addr $geoip_country_code $alianza_pais_permitido $status "$request"';
map "$alianza_pais_permitido:$status" $alianza_registrar_bloqueo {
    ~^0:     1;
    ~:429$   1;
    ~:444$   1;
    default  0;
}
