# nginx delante del servidor: entrega el sitio (archivos ya comprimidos) y pasa /api y /panel al servidor.
# instalar.sh lo copia a /etc/nginx/sites-available/alianza. Para HTTPS: sudo certbot --nginx -d tu-dominio
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/alianza/sitio;
    index index.html;
    client_max_body_size 26m;   # subida de archivos del panel (máximo 25 MB)

    gzip_static on;             # usa los .gz que genera empaquetar.sh: no comprime en cada visita

    # Archivos del sitio con nombre único por versión: el navegador los guarda un año.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /panel/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /salud { proxy_pass http://127.0.0.1:5000; }

    # Rutas del sitio (/wiki/...): las resuelve el propio sitio.
    location / {
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        try_files $uri /index.html;
    }
}
