# nginx delante del servidor: entrega el sitio (archivos ya comprimidos) y pasa /api y /panel al servidor.
# instalar.sh lo copia a /etc/nginx/sites-available/alianza. La protección general está en conf.d/alianza.conf.
# Para HTTPS: sudo certbot --nginx -d tu-dominio
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/alianza/sitio;
    index index.html;
    client_max_body_size 1m;
    gzip_static on;             # usa los .gz que genera empaquetar.sh: no comprime en cada visita

    access_log /var/log/alianza/nginx-bloqueos.log alianza_bloqueos if=$alianza_registrar_bloqueo;
    limit_conn alianza_conexiones 30;

    # 1. País fuera de la lista: se corta la conexión sin responder (444, lo más barato).
    if ($alianza_pais_permitido = 0) { return 444; }

    # 2. Sondeos típicos de bots (WordPress, PHP, archivos ocultos...): este sitio no tiene nada de eso.
    location ~* (\.(php\d?|asp|aspx|jsp|cgi|sql|bak|old|swp)$|/\.(?!well-known)|/(wp-admin|wp-login|wp-content|wordpress|phpmyadmin|pma|xmlrpc|cgi-bin|actuator|vendor|server-status|boaform)) {
        return 444;
    }

    # Cabeceras de seguridad del sitio.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://www.tiktok.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    # Activar al tener HTTPS:  add_header Strict-Transport-Security "max-age=31536000" always;

    # Archivos del sitio con nombre único por versión: el navegador los guarda un año.
    location /assets/ {
        limit_req zone=alianza_sitio burst=60 nodelay;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # 3. Inicio de sesión del panel: 10 por minuto por IP (el servidor además bloquea la cuenta tras 5 fallos).
    location = /api/sesion/iniciar {
        limit_req zone=alianza_sesion burst=5 nodelay;
        include /etc/nginx/snippets/alianza-proxy.conf;
    }

    # 4. Subida de archivos del panel: la única ruta que acepta cuerpos grandes (hasta 60 MB).
    location = /api/panel/medios {
        client_max_body_size 61m;
        client_body_timeout 120s;
        limit_req zone=alianza_api burst=20 nodelay;
        include /etc/nginx/snippets/alianza-proxy.conf;
    }

    location /api/ {
        limit_req zone=alianza_api burst=60 nodelay;
        include /etc/nginx/snippets/alianza-proxy.conf;
    }

    location /panel/ {
        limit_req zone=alianza_sitio burst=40 nodelay;
        include /etc/nginx/snippets/alianza-proxy.conf;
    }

    location = /salud { access_log off; proxy_pass http://127.0.0.1:5000; }

    # Rutas del sitio (/wiki/...): las resuelve el propio sitio.
    location / {
        limit_req zone=alianza_sitio burst=40 nodelay;
        try_files $uri /index.html;
    }
}
