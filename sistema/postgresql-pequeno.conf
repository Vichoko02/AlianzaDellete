# PostgreSQL para un servidor pequeño (≈1 GB de RAM). instalar.sh lo copia a conf.d/.
# El servidor de La Alianza usa a lo más 10 conexiones; el resto queda para administración.
max_connections = 20
shared_buffers = 64MB
effective_cache_size = 256MB
work_mem = 2MB
maintenance_work_mem = 32MB
wal_buffers = 2MB
max_wal_size = 256MB
min_wal_size = 32MB
max_worker_processes = 2
max_parallel_workers = 1
max_parallel_workers_per_gather = 0
# Solo por socket local.
listen_addresses = ''
